name: Deploy

on:
  workflow_call:
    inputs:
      env_name:
        required: true
        type: string
      app_name:
        required: true
        type: string
      artifact_name:
        required: false
        type: string
        default: build-output
      run_id:
        required: false
        type: string
        default: ''
      build_workflow_name:
        required: false
        type: string
        default: build-deploy.yml
    secrets:
      ARM_CLIENT_ID:
        required: true
      ARM_SUBSCRIPTION_ID:
        required: true
      ARM_TENANT_ID:
        required: true
      RESOURCE_GROUP:
        required: true
      UDM_2_CONNECTION_STRING:
        required: true

  workflow_dispatch:
    inputs:
      env_name:
        required: true
        type: choice
        default: 'dev'
        options:
          - 'dev'
          - 'prod'
      app_name:
        required: true
        type: string
        default: fds-udm-api-dev
      artifact_name:
        required: false
        type: string
        default: build-output
      run_id:
        description: Specific run ID to download artifact from (optional)
        required: false
        type: string
        default: ''
      build_workflow_name:
        required: false
        type: string
        default: build-deploy.yml

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to App Service
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Resolve run id
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if [ -n "${{ inputs.run_id }}" ]; then
            RUN_ID="${{ inputs.run_id }}"
          else
            RUN_ID=$(gh api \
              "repos/${{ github.repository }}/actions/workflows/${{ inputs.build_workflow_name }}/runs?status=success&per_page=1" \
              --jq '.workflow_runs[0].id')
          fi

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "No successful run found for workflow '${{ inputs.build_workflow_name }}'."
            exit 1
          fi

          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "Using RUN_ID=$RUN_ID"

      - name: Download artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          ARTIFACT_ID=$(gh api \
            "repos/${{ github.repository }}/actions/runs/${{ steps.resolve.outputs.run_id }}/artifacts" \
            --jq '.artifacts[] | select(.name == "${{ inputs.artifact_name }}") | .id')

          if [ -z "$ARTIFACT_ID" ] || [ "$ARTIFACT_ID" = "null" ]; then
            echo "Artifact '${{ inputs.artifact_name }}' not found in run '${{ steps.resolve.outputs.run_id }}'."
            exit 1
          fi

          gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" > artifact.zip
          unzip artifact.zip -d $GITHUB_WORKSPACE/publish

      - name: Create package zip
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/publish
          zip -r $RUNNER_TEMP/${{ github.sha }}.zip *

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}

      - name: Set Connection String
        uses: azure/CLI@v1
        with:
          inlineScript: |
            az webapp config connection-string set \
              --name ${{ inputs.app_name }} \
              --resource-group ${{ secrets.RESOURCE_GROUP }} \
              --connection-string-type SQLServer \
              --settings UDM_2="${{ secrets.UDM_2_CONNECTION_STRING }}"

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ inputs.app_name }}
          package: ${{ runner.temp }}/${{ github.sha }}.zip

      - name: Azure logout
        shell: bash
        run: az logout
