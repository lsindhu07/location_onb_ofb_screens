name: Build & Deploy

on:
  workflow_dispatch:
    inputs:
      env_name:
        description: Deployment environment
        required: true
        default: 'dev'
        type: choice
        options:
          - 'dev'
          - 'prod'
      skip_build:
        description: Skip build and use last artifact
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read
  actions: read

env:
  BASE_AZURE_WEBAPP_NAME: fds-udm-api
  ARTIFACT_NAME: build-output
  RETENTION_DAYS: 3

jobs:
  setup:
    name: Setup Environment
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.set-env.outputs.env_name }}
      app_name: ${{ steps.set-env.outputs.app_name }}
      artifact_name: ${{ steps.set-env.outputs.artifact_name }}
      run_id: ${{ steps.set-env.outputs.run_id }}
    steps:
      - id: set-env
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.env_name }}" ]; then
            ENV_NAME="${{ github.event.inputs.env_name }}"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            ENV_NAME="dev"
          else
            ENV_NAME="dev"
          fi

          echo "env_name=$ENV_NAME" >> $GITHUB_OUTPUT
          echo "app_name=${{ env.BASE_AZURE_WEBAPP_NAME }}-$ENV_NAME" >> $GITHUB_OUTPUT
          echo "artifact_name=${{ env.ARTIFACT_NAME }}" >> $GITHUB_OUTPUT

          if [ "${{ github.event.inputs.skip_build }}" = "true" ]; then
            echo "run_id=" >> $GITHUB_OUTPUT
          else
            echo "run_id=${{ github.run_id }}" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build/Test/Publish
    runs-on: ubuntu-latest
    needs: setup
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.skip_build != 'true' }}
    environment: ${{ needs.setup.outputs.env_name }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore eps-fdsudm-api.sln

      - name: Build
        run: dotnet build eps-fdsudm-api.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/eps-fdsudm-api.Tests/eps-fdsudm-api.Tests.csproj -c Release --no-build

      - name: Publish API
        run: dotnet publish src/eps-fdsudm-api/eps-fdsudm-api.csproj -c Release --no-build -o ${{ github.workspace }}/publish

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.setup.outputs.artifact_name }}
          path: ${{ github.workspace }}/publish
          retention-days: ${{ env.RETENTION_DAYS }}

  deploy:
    name: Deploy
    needs: [setup, build]
    if: ${{ always() && needs.setup.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    uses: ./.github/workflows/deploy.yml
    with:
      app_name: ${{ needs.setup.outputs.app_name }}
      env_name: ${{ needs.setup.outputs.env_name }}
      artifact_name: ${{ needs.setup.outputs.artifact_name }}
      run_id: ${{ needs.setup.outputs.run_id }}
      build_workflow_name: build-deploy.yml
    secrets:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
