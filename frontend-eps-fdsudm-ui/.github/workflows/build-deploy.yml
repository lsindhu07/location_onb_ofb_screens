name: Build & Deploy

on:
  workflow_dispatch:
    inputs:
      env_name:
        description: 'Deployment environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - prod
          - dev
      skip_build:
        description: 'Skip build and use last artifact'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read
  actions: read

env:
  NODE_VERSION: "24.x"
  CI: false
  BASE_AZURE_WEBAPP_NAME: "fds-udm-ui"
  AZURE_WEBAPP_PACKAGE_PATH: $RUNNER_TEMP/${{ github.sha }}.zip
  ARTIFACT_NAME: "build-output"
  RETENTION_DAYS: 3
  VITE_BE_URL: "https://fds-udm-api-dev.azurewebsites.net"
  
jobs:
  setup:
    name: Setup Environment
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.set-env.outputs.env_name }}
      app_name: ${{ steps.set-env.outputs.app_name }}
      artifact_name: ${{ steps.set-env.outputs.artifact_name }}
      run_id: ${{ steps.set-env.outputs.run_id }}
    steps:
      - id: set-env
        run: |
          if [ -n "${{ github.event.inputs.env_name }}" ]; then
            ENV_NAME="${{ github.event.inputs.env_name }}"
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            ENV_NAME="dev"
          else
            ENV_NAME="dev"
          fi

          echo "run_id=${{ github.run_id }}" >> $GITHUB_OUTPUT
          echo "artifact_name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT
          echo "app_name=${{ env.BASE_AZURE_WEBAPP_NAME }}-$ENV_NAME" >> $GITHUB_OUTPUT
          echo "env_name=$ENV_NAME" >> $GITHUB_OUTPUT

          echo "run_id: ${{ github.run_id }}"
          echo "ENV_NAME: $ENV_NAME"
          echo "APP_NAME: $APP_NAME"
  build:
    runs-on: ubuntu-latest
    needs: setup
    if: ${{ github.event.inputs.skip_build != 'true' }}
    environment: ${{ needs.setup.outputs.env_name }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"                          

      - name: Setup JFrog
        uses: EMOrg-Prd/setup-jfrog@v1
        with:
          PACKAGE_MANAGER: npm
          REPOSITORY: npm-remote

      - name: Configure npm registries   
        run: |
          npm config set //npm.pkg.github.com/:_authToken=${{ secrets.GH_CENTRAL_PERSONAL_ACCESS_TOKEN }}
          npm config set @emorg-prd:registry=https://npm.pkg.github.com/

      - name: Install dependencies
        run: npm ci                   

      - name: Build
        run: npm run build
        env:
          VITE_BE_URL: ${{ env.VITE_BE_URL }}
          
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.setup.outputs.artifact_name }}
          path: ${{ github.workspace }}/build
          retention-days: ${{ env.RETENTION_DAYS }}  
          
  deploy:
    needs: [setup, build]
    if: ${{ always() && needs.setup.result == 'success' }}
    uses: ./.github/workflows/deploy.yml
    with:
      app_name: ${{ needs.setup.outputs.app_name }}
      env_name: ${{ needs.setup.outputs.env_name }}
      artifact_name: ${{ needs.setup.outputs.artifact_name }}
      run_id: ${{ needs.setup.outputs.run_id }}
    secrets:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}


