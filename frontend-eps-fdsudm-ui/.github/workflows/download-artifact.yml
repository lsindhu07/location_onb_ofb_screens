name: Download Last Artifact

on:
  workflow_call:
    inputs:
      artifact_name:
        required: true
        type: string
      workflow_file:
        required: true
        type: string
      download_path:
        required: true
        type: string
      run_id:
        required: false
        type: string
        default: ''

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.run_id }}" ]; then
            echo "Using provided run ID: ${{ inputs.run_id }}"
            RUN_ID="${{ inputs.run_id }}"
          else
            echo "Finding last successful run..."
            RUN_ID=$(gh api \
              "repos/${{ github.repository }}/actions/workflows/${{ inputs.workflow_file }}/runs?status=success&per_page=1" \
              --jq '.workflow_runs[0].id')
            echo "Last successful run ID: $RUN_ID"
          fi

          ARTIFACT_ID=$(gh api \
            "repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name == "${{ inputs.artifact_name }}") | .id')


          echo "Artifact ID: $ARTIFACT_ID"

          gh api \
            "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" \
            > artifact.zip

          unzip artifact.zip -d ${{ inputs.download_path }}
